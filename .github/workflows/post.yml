name: post-to-threads
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency: threads-post
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 post.py
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      - run: |
          git config user.name "threads-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || (git commit -m "posted" && git push)
